services:
  bot:
    build:
      context: .
      args:
        # Pass the commit so the bot can tell when it's stale:
        #   GIT_SHA=$(git rev-parse HEAD) docker compose up -d --build
        GIT_SHA: ${GIT_SHA:-}
    container_name: warbandeer-discord
    env_file: .env
    volumes:
      - state:/app/data
    restart: unless-stopped
    init: true

  # Opt-in: exposes a future local API to the internet without opening inbound
  # firewall ports. Requires CLOUDFLARE_TUNNEL_TOKEN in .env (see README). Start with:
  #   docker compose --profile tunnel up -d --build
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: warbandeer-discord-tunnel
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - bot
    profiles:
      - tunnel

volumes:
  state:
