[package]
name = "warbandeer-desktop"
version = "0.2.4"
description = "Desktop companion for the Warbandeer addon suite"
authors = ["Nazuraki"]
edition = "2021"

[lib]
name = "warbandeer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mlua = { version = "0.10", features = ["lua51", "vendored", "serialize"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
