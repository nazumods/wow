[package]
name = "warbandeer-desktop"
version = "0.2.9"
description = "Desktop companion for the Warbandeer addon suite"
authors = ["Nazuraki"]
edition = "2021"

[lib]
name = "warbandeer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Operator-only Bot Ops panel backend. Shared module — the same crate is vendored into
# roshne/wow-companion, so it is maintained only at apps/bot-ops/rust.
bot-ops = { path = "../../bot-ops/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Icon names are not all url-safe — the listfile carries a handful with literal spaces
# ("ui_majorfaction_ vines") — so the wbicon scheme has to decode what the webview encoded.
percent-encoding = "2"
mlua = { version = "0.10", features = ["lua51", "vendored", "serialize"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
