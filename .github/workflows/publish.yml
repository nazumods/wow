name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  curseforge:
    # Skip desktop-app releases (apps/ → `app-*` tags, published by app-release.yml).
    # They carry no .toc and aren't CurseForge addons. workflow_dispatch passes the
    # guard (empty tag_name) and is format-checked by the first step below.
    if: ${{ !startsWith(github.event.release.tag_name, 'app-') }}
    runs-on: ubuntu-latest

    steps:
      - name: Validate ref is a release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$REF_NAME" =~ ^[A-Za-z_]+-v[0-9]+\.[0-9]+\.[0-9]+-r[0-9]+$ ]]; then
            echo "Error: must be run from a release tag (e.g. LibNAddOn-v12.0.5-r1), got: $REF_NAME"
            exit 1
          fi

      # github.event.release.body is untrusted (it's the changelog, built from
      # commit subjects) and can contain quotes/backticks — it must reach the
      # shell only via an env var, never interpolated straight into `run:`,
      # or a crafted/careless commit message can inject arbitrary shell.
      - name: Resolve tag and release info
        id: info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          EVENT_BODY: ${{ github.event.release.body }}
          EVENT_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$REF_NAME"
            BODY=$(gh release view "$TAG" --repo "$REPO" --json body --jq .body)
            PRERELEASE=$(gh release view "$TAG" --repo "$REPO" --json isPrerelease --jq .isPrerelease)
          else
            TAG="$EVENT_TAG"
            BODY="$EVENT_BODY"
            PRERELEASE="$EVENT_PRERELEASE"
          fi

          echo "tag=$TAG"               >> "$GITHUB_OUTPUT"
          echo "addon=${TAG%-v*}"       >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

          # Multiline body needs a heredoc-style output
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.info.outputs.tag }}

      # Reads X-Curse-Project-ID and Interface from the .toc.
      # An addon is only published if X-Curse-Project-ID is present.
      # Interface values (e.g. "120105" or "110002, 110005") are converted to
      # CurseForge game version strings: <major>.<minor>.<patch>, read from the RIGHT, so the
      # last two digits are the patch, the two before them the minor, and whatever is left the
      # major (leading zeros stripped): 120105 → 12.1.5, 16001 → 1.60.1, 11509 → 1.15.9.
      # Reading from the left turned the five-digit 16001 into 16.0.1.
      - name: Read .toc metadata
        id: toc
        run: |
          ADDON="${{ steps.info.outputs.addon }}"
          # The folder-named .toc, with NO fallback to "any .toc in the folder" (#742). That
          # fallback is how a folder rename that missed its .toc got metadata read, zipped and
          # uploaded as an addon WoW cannot load. Fail loudly instead — this is the last gate
          # before the package reaches CurseForge.
          TOC="${ADDON}/${ADDON}.toc"
          [[ -f "$TOC" ]] || TOC="${ADDON}/${ADDON}_Mainline.toc"
          if [[ ! -f "$TOC" ]]; then
            echo "::error::${ADDON}/ has no ${ADDON}.toc — WoW will not load this package"
            ls "${ADDON}"/*.toc || true
            exit 1
          fi

          PROJECT_ID=$(grep -E "^## X-Curse-Project-ID:" "$TOC" \
            | sed 's/## X-Curse-Project-ID:[[:space:]]*//' | tr -d '\r')

          if [[ -z "$PROJECT_ID" ]]; then
            echo "No X-Curse-Project-ID in $TOC — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "skip=false"             >> "$GITHUB_OUTPUT"

          # The read below takes the FIRST `## Interface:` line only, so a .toc with `120105` on one line
          # and `16001` on another would upload with 12.1.5 alone and still pass the verify step below.
          # Several clients go on ONE comma-separated line; fail on a second line instead of dropping it.
          IFACE_LINES=$(grep -cE "^## Interface:" "$TOC" || true)
          if (( IFACE_LINES > 1 )); then
            echo "::error::${TOC} has ${IFACE_LINES} '## Interface:' lines -- put every client on one comma-separated line (e.g. 120105, 16001)"
            exit 1
          fi

          IFACE_RAW=$(grep -E "^## Interface:" "$TOC" \
            | sed 's/## Interface:[[:space:]]*//' | tr -d '\r')

          # BEGIN iface_to_version -- extracted and tested by Tooling/tests/game-versions.test.sh
          iface_to_version() {
            local i="${1//[[:space:]]/}"
            if [[ ! "$i" =~ ^[0-9]{5,6}$ ]]; then
              echo "::error::Unrecognised Interface value '$1' (expected 5 or 6 digits)" >&2
              return 1
            fi
            printf '%d.%d.%d' $(( 10#${i:0: -4} )) $(( 10#${i: -4:2} )) $(( 10#${i: -2:2} ))
          }
          # END iface_to_version

          GAME_VERSIONS=""
          IFS=',' read -ra IFACES <<< "$IFACE_RAW"
          for iface in "${IFACES[@]}"; do
            ver=$(iface_to_version "$iface") || exit 1
            GAME_VERSIONS="${GAME_VERSIONS:+${GAME_VERSIONS},}${ver}"
          done

          echo "game_versions=$GAME_VERSIONS" >> "$GITHUB_OUTPUT"

      # The upload action drops any game-version NAME CurseForge doesn't know, silently -- it filters the
      # API's version list by name, then slug, and never reports a miss (curseforge-upload.js:56-85 at
      # v3.1.2). That is how `16.0.1` would have shipped Forever builds unlabelled. Fail loudly instead
      # (this step checks the name only, the stricter test); re-run the workflow once CurseForge has
      # added the version.
      - name: Verify game versions exist on CurseForge
        if: steps.toc.outputs.skip != 'true'
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          GAME_VERSIONS: ${{ steps.toc.outputs.game_versions }}
        run: |
          # BEGIN missing_versions -- extracted and tested by Tooling/tests/game-versions.test.sh
          # $1 = newline-separated names CurseForge knows; $2 = comma-separated wanted names.
          missing_versions() {
            local known="$1" v out=""
            local -a want
            IFS=',' read -ra want <<< "$2"
            for v in "${want[@]}"; do
              grep -qxF -- "$v" <<< "$known" || out="${out:+$out }$v"
            done
            printf '%s' "$out"
          }
          # END missing_versions
          if [[ -z "$GAME_VERSIONS" ]]; then
            echo "::error::No game version to upload with -- the .toc has no '## Interface:' value (the line must start in column 1: a BOM or leading spaces hide it)"
            exit 1
          fi
          # Not one pipeline: GitHub's default shell has no pipefail, so a failed curl would reach jq
          # as empty input and surface as "CurseForge has no game version named: ..." for every version.
          # --max-time 30 bounds each attempt, so a connection that hangs is dropped after 30 s instead of
          # waiting for the job's own timeout; --retry 2 absorbs one transient 5xx or rate limit. curl honours
          # a Retry-After header between attempts, so a long one can still delay this step: the job's own
          # timeout is the outer bound.
          if ! response=$(curl -sf --max-time 30 --retry 2 -H "X-Api-Token: $CF_TOKEN" https://wow.curseforge.com/api/game/versions); then
            echo "::error::Could not list CurseForge game versions (bad token or CurseForge API down) -- re-run the workflow later"
            exit 1
          fi
          if ! known=$(jq -r '.[].name' <<< "$response"); then
            echo "::error::Unexpected CurseForge game-versions response (expected a JSON list of objects with a name)"
            exit 1
          fi
          missing=$(missing_versions "$known" "$GAME_VERSIONS")
          if [[ -n "$missing" ]]; then
            echo "::error::CurseForge has no game version named: $missing -- the upload would silently drop it"
            exit 1
          fi
          echo "CurseForge knows every game version: $GAME_VERSIONS"

      # Zip just the addon folder so it installs correctly into AddOns/.
      # spec/ holds busted unit tests and tools/ holds maintainer-only scripts —
      # never ship either.
      - name: Package addon zip
        if: steps.toc.outputs.skip != 'true'
        run: |
          ADDON="${{ steps.info.outputs.addon }}"
          zip -r "${ADDON}.zip" "${ADDON}/" --exclude "*.git*" "${ADDON}/spec/*" "${ADDON}/tools/*"

      - name: Upload to CurseForge
        if: steps.toc.outputs.skip != 'true'
        uses: itsmeow/curseforge-upload@1493c4408b462f2ad8beb600f09c505e0c158397 # v3.1.2
        with:
          token: ${{ secrets.CURSEFORGE_API_TOKEN }}
          game_endpoint: wow
          project_id: ${{ steps.toc.outputs.project_id }}
          changelog: ${{ steps.info.outputs.body }}
          changelog_type: markdown
          release_type: ${{ steps.info.outputs.prerelease == 'true' && 'beta' || 'release' }}
          game_versions: ${{ steps.toc.outputs.game_versions }}
          file_path: "${{ steps.info.outputs.addon }}.zip"
