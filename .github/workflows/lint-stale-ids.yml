name: Lint stale ids

# Drift watch for the hand-authored WoW id literals in the static data files. The PR gate in
# test.yml catches a bad id the moment someone *edits* a data file; this catches the other
# direction — a Blizzard patch that removes/renames an id with no PR to trigger on, leaving a
# hardcoded id pointing at nothing (a blank/mismatched row in-game). Runs daily against the
# latest live build, with heavy CSVs pulled only when the build changed (a build-keyed cache —
# safe because drift is caused BY a build change, which busts the key). Because a stale id
# doesn't self-heal, it fails every day until the data
# file is fixed, and (like update-collected-sets.yml) two failures in a row raise a tracking
# issue — so a one-off wago.tools blip is retried next day, while real drift is surfaced.
on:
  schedule:
    - cron: "0 8 * * *" # daily 08:00 UTC (offset from the 07:00 set-refresh)
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: lint-stale-ids
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Resolve the live build once (a ~1KB call) and key the CSV cache on it, so heavy tables are
      # pulled only when a new build shipped. Shares the build-keyed cache the PR gate warms on main.
      - name: Resolve wago build
        id: build
        run: echo "version=$(curl -sf -A 'Warbandeer-suite-ci (github.com/nazumods/wow)' https://wago.tools/api/builds/wow/latest | jq -r .version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .wago-cache
          key: wago-csv-${{ steps.build.outputs.version }}

      # Full check against that build (no -SkipBig: drift can hit the Item-backed rules too).
      # pwsh is preinstalled on ubuntu runners. Exit 1 on any stale fail-rule id.
      - name: Validate hand-authored ids against live client DB2
        shell: pwsh
        run: ./Tooling/lint-stale-ids.ps1 -Build "${{ steps.build.outputs.version }}" -CacheDir .wago-cache

  # Two consecutive failures (a stale id that persists across days, not a one-off wago blip)
  # open or comment on a tracking issue; a successful run closes it.
  notify:
    needs: lint
    if: always()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      LABEL: stale-id-drift
    steps:
      - name: Raise issue on a second consecutive failure
        if: needs.lint.result == 'failure'
        run: |
          prev=$(gh run list -R "$REPO" --workflow lint-stale-ids.yml --branch main \
                   --status completed --limit 1 --json conclusion --jq '.[0].conclusion // ""')
          echo "Previous completed run conclusion: ${prev:-none}"
          if [ "$prev" != "failure" ]; then
            echo "First failure — could be a transient wago.tools blip; the daily schedule retries tomorrow. No issue yet."
            exit 0
          fi
          gh label create "$LABEL" -R "$REPO" --color B60205 \
            --description "A hand-authored id no longer resolves in the live client DB2" 2>/dev/null || true
          existing=$(gh issue list -R "$REPO" --label "$LABEL" --state open \
                       --json number --jq '.[0].number // ""' 2>/dev/null)
          if [ -n "$existing" ]; then
            gh issue comment -R "$REPO" "$existing" --body "Still stale — $RUN_URL"
            exit 0
          fi
          gh issue create -R "$REPO" --label "$LABEL" \
            --title "A hand-authored id has gone stale (drift detected)" \
            --body "$(printf '%s\n' \
              'The scheduled "Lint stale ids" workflow failed two consecutive runs: a hand-authored id literal in a static data file no longer resolves against the live client DB2 (wago.tools).' \
              '' \
              'A Blizzard build most likely removed or renamed the id, so the addon now renders a blank or mismatched row for it until the data file is corrected.' \
              '' \
              "Latest failed run (names the failing rule + id): $RUN_URL" \
              '' \
              'Reproduce locally with `pwsh Tooling/lint-stale-ids.ps1`; the offending rule points at the file + DB2 column to fix. See Tooling/README.md.' \
              '' \
              'This issue auto-closes when a run succeeds.')"

      - name: Close the tracking issue on recovery
        if: needs.lint.result == 'success'
        run: |
          for n in $(gh issue list -R "$REPO" --label "$LABEL" --state open \
                       --json number --jq '.[].number' 2>/dev/null); do
            gh issue close -R "$REPO" "$n" --comment "Drift resolved — $RUN_URL"
          done
