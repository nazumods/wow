name: Update desktop static data

# Regenerates apps/warbandeer-desktop/src-tauri/data/static-data.json (the desktop
# app's offline currency lookup) from live wago.tools DB2 data and opens a PR when
# the data changed.
#
# WEEKLY, and deliberately NOT auto-merged — the data is worth a human glance before it
# ships, since the bundle is embedded in the exe (include_str!).
#
# It no longer needs a paired version bump: since #638, app-release.yml runs on a daily
# cron and auto-bumps via .github/scripts/app-release.sh, rather than firing on a push to
# apps/warbandeer-desktop/**. The old warning here (and in the PR body) told reviewers to
# bump the version by hand or the immutable-release build would fail; that stopped being
# true when the release flow moved to cron.
on:
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: update-static-data
  cancel-in-progress: false

jobs:
  refresh:
    # Windows, matching app-test.yml and app-release.yml. This job compiles the Tauri crate
    # (see the validation step below), and it was the ONLY place in the repo doing that on
    # Ubuntu — where the Tauri system dependencies aren't present, so `cargo test` died in
    # pkg-config looking for `glib-2.0.pc` and the weekly refresh stopped running (#808).
    #
    # Installing the Linux Tauri stack here would also work, but it means carrying an
    # apt dependency list for a Windows-targeted app that nothing else in the repo builds on
    # Linux. Running where the app is already tested keeps one platform to maintain.
    #
    # The generator itself is unaffected: it is pwsh (native here) and normalises its own line
    # endings precisely so a Linux run and a Windows run produce an identical bundle.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # pwsh is preinstalled on ubuntu runners; the generator is cross-platform
      # (it normalises its own line endings so a Linux run matches a Windows one).
      - name: Regenerate static-data.json from wago.tools
        shell: pwsh
        run: ./Tooling/update-static-data.ps1

      # The bundle is embedded via include_str!, so a malformed or truncated file is a
      # compile/test failure rather than a runtime one. Run the loader's tests against
      # the freshly generated asset before proposing it — PRs opened with GITHUB_TOKEN
      # don't trigger app-test.yml, so this is the only gate the data gets.
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/warbandeer-desktop/src-tauri -> target
      - name: Validate the regenerated bundle
        working-directory: apps/warbandeer-desktop/src-tauri
        run: cargo test --lib staticdata

      - name: Open PR if changed
        uses: peter-evans/create-pull-request@v8
        with:
          branch: bot/desktop-static-data-refresh
          delete-branch: true
          add-paths: apps/warbandeer-desktop/src-tauri/data/static-data.json
          commit-message: "chore(desktop): refresh static game data from wago.tools"
          title: "chore(desktop): refresh static game data from wago.tools"
          body: |
            Automated refresh of the desktop app's offline lookup bundle
            (`apps/warbandeer-desktop/src-tauri/data/static-data.json`) from live
            [wago.tools](https://wago.tools) `CurrencyTypes` data.

            **No version bump needed.** Since #638 the app release runs on a daily cron and
            auto-bumps `tauri.conf.json` + `package.json` + `Cargo.toml` + `Cargo.lock`
            itself (`.github/scripts/app-release.sh`), so merging this just means the next
            scheduled release picks the data up. Review the diff on its merits.

            Generated by `Tooling/update-static-data.ps1`; see
            `Tooling/UPDATING-static-data.md`.
          labels: |
            automated
            desktop

  # The weekly schedule retries a failed run next week, which is a long gap — so unlike
  # the daily Collected refresh, raise the tracking issue on the FIRST failure.
  notify:
    needs: refresh
    if: always()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      LABEL: desktop-automation-failure
    steps:
      - name: Raise issue on failure
        if: needs.refresh.result == 'failure'
        run: |
          gh label create "$LABEL" -R "$REPO" --color B60205 \
            --description "Desktop static-data automation failed" 2>/dev/null || true
          existing=$(gh issue list -R "$REPO" --label "$LABEL" --state open \
                       --json number --jq '.[0].number // ""' 2>/dev/null)
          if [ -n "$existing" ]; then
            gh issue comment -R "$REPO" "$existing" --body "Still failing — $RUN_URL"
            exit 0
          fi
          gh issue create -R "$REPO" --label "$LABEL" \
            --title "Desktop static-data automation failed" \
            --body "$(printf '%s\n' \
              'The scheduled "Update desktop static data" workflow failed, so apps/warbandeer-desktop/src-tauri/data/static-data.json is not being refreshed from wago.tools.' \
              '' \
              "Latest failed run: $RUN_URL" \
              '' \
              'Likely causes: wago.tools unreachable or changed; a CurrencyTypes column was renamed (the generator asserts its schema and aborts); an integrity guard tripped (row floor, >5% currency deletion, or >5% of icon ids missing the listfile); or the loader tests rejected the generated file.' \
              '' \
              'Investigate via the run logs above, or run `pwsh Tooling/update-static-data.ps1 -Check` locally. See Tooling/UPDATING-static-data.md.' \
              '' \
              'This issue auto-closes when a run succeeds.')"

      - name: Close the tracking issue on recovery
        if: needs.refresh.result == 'success'
        run: |
          for n in $(gh issue list -R "$REPO" --label "$LABEL" --state open \
                       --json number --jq '.[].number' 2>/dev/null); do
            gh issue close -R "$REPO" "$n" --comment "Automation recovered — $RUN_URL"
          done
