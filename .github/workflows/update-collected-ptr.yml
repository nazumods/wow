name: Update Collected PTR preview

# Watches for a NEW PTR PATCH (e.g. 12.1.0 -> 12.1.5) and, when one opens, replaces
# Warbandeer_Collected/data/sets_ptr.lua with the new patch's upcoming-set delta and
# opens a PR. Unlike the live set-data refresh, this is gated on the PTR *patch*, not
# every build: within-patch PTR builds churn constantly (sets added/removed between
# bumps), so a daily PR on each would be noise. The cheap check only hits wago's
# build list; the full download + regenerate runs only when the patch actually moved.
on:
  schedule:
    - cron: "30 7 * * *" # daily 07:30 UTC (after the live refresh at 07:00)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: update-collected-ptr
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Cheap, patch-aware probe (no CSV download). Runs in a child process so the
      # script's `exit` doesn't terminate this step. Exit codes:
      #   2 = a new PTR patch (or a missing file) → regenerate the upcoming list
      #   3 = LIVE CAUGHT UP: the delta still lists a patch that has since gone live →
      #       regenerate (clearing the now-live rows) AND remind us to curate it into the live grid
      #   0 = nothing to do; anything else = a real error
      - name: Check for a new PTR patch or live catch-up
        id: check
        shell: pwsh
        run: |
          pwsh -File ./Warbandeer_Collected/tools/update-sets.ps1 -PtrDelta -Check
          $code = $LASTEXITCODE
          Write-Host "check exit code: $code"
          if ($code -eq 2) { "regen=true"  >> $env:GITHUB_OUTPUT; "caughtup=false" >> $env:GITHUB_OUTPUT }
          elseif ($code -eq 3) { "regen=true"  >> $env:GITHUB_OUTPUT; "caughtup=true"  >> $env:GITHUB_OUTPUT }
          elseif ($code -eq 0) { "regen=false" >> $env:GITHUB_OUTPUT; "caughtup=false" >> $env:GITHUB_OUTPUT }
          else { exit 1 }   # real failure (wago unreachable, etc.)

      - name: Regenerate sets_ptr.lua for the new patch
        if: steps.check.outputs.regen == 'true'
        shell: pwsh
        run: ./Warbandeer_Collected/tools/update-sets.ps1 -PtrDelta

      # Validate here: PRs opened with GITHUB_TOKEN don't trigger the normal luacheck
      # workflow, so lint the regenerated file before opening one.
      - uses: leafo/gh-actions-lua@v13
        if: steps.check.outputs.regen == 'true'
        with:
          luaVersion: "5.1.5"
      - uses: leafo/gh-actions-luarocks@v6
        if: steps.check.outputs.regen == 'true'
      - name: Install luacheck
        if: steps.check.outputs.regen == 'true'
        run: luarocks install luacheck
      - name: Lint regenerated file
        if: steps.check.outputs.regen == 'true'
        run: luacheck Warbandeer_Collected/data/sets_ptr.lua --codes

      - name: Open PR replacing the PTR preview list
        if: steps.check.outputs.regen == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: bot/collected-ptr-refresh
          delete-branch: true
          # Only the data file — the luacheck step leaves a .luarocks/ dir behind.
          add-paths: Warbandeer_Collected/data/sets_ptr.lua
          commit-message: "chore(collected): refresh the PTR preview data"
          title: "chore(collected): refresh the PTR preview data"
          body: |
            The upcoming-set preview (`Warbandeer_Collected/data/sets_ptr.lua`) has been
            regenerated from the latest [wago.tools](https://wago.tools) `TransmogSet`
            delta (sets on the PTR `wowt` build but not yet on live `wow`). This fires
            either because a **new PTR patch** opened, or because the previously-previewed
            patch has **gone live** — in which case the delta empties (nothing is upcoming)
            and a separate `collected-curate-live` issue tracks curating it into the live grid.

            The whole list is replaced (it represents one patch). `ns.PtrBuild` at the top
            shows the live/PTR builds it came from.

            Generated by `Warbandeer_Collected/tools/update-sets.ps1 -PtrDelta`; see
            `Warbandeer_Collected/tools/UPDATING.md`. PTR data is volatile — **review the
            diff before merging.**
          labels: |
            automated
            collected

      # LIVE CAUGHT UP (check exit 3): the now-live sets need CURATING into the live grid
      # (sets_late.lua shells / expand-groups.txt) — the one thing the live generator can't do for a
      # new tier. Open a tracking issue so that manual step isn't forgotten (deduped: one at a time).
      - name: Remind to curate the now-live patch into the live grid
        if: steps.check.outputs.caughtup == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LABEL: collected-curate-live
        run: |
          gh label create "$LABEL" -R "$REPO" --color 0E8A16 \
            --description "A live patch's sets need curating into the Collected grid" 2>/dev/null || true
          existing=$(gh issue list -R "$REPO" --label "$LABEL" --state open \
                       --json number --jq '.[0].number // ""' 2>/dev/null)
          if [ -n "$existing" ]; then
            echo "Curate-live issue already open (#$existing) — not duplicating."
            exit 0
          fi
          gh issue create -R "$REPO" --label "$LABEL" \
            --title "Collected: curate the now-live patch's sets into the live grid" \
            --body "$(printf '%s\n' \
              'A patch that was in the PTR preview has gone LIVE, so the preview delta was cleared — but its sets are NOT yet in the curated live grid. The live generator only fills existing shells, so a new tier must be hand-seeded (this is exactly why 12.1 content first appeared only under the PTR toggle).' \
              '' \
              "Triggered by: $RUN_URL" \
              '' \
              'To curate:' \
              '1. `pwsh Warbandeer_Collected/tools/update-sets.ps1 -AuditCoverage` — lists the uncaptured live groups by category.' \
              '2. Seed raid / PvP shells in `data/sets_late.lua` (look up the group id + JournalInstanceID on wago; difficulty is the name suffix); route dungeon armor-type groups / recolors via `tools/expand-groups.txt`.' \
              '3. `pwsh update-sets.ps1` (+ `-Expand`) to fill; verify in-game.' \
              '' \
              'See the Patch-day baseline in Warbandeer_Collected/tools/UPDATING.md. Filed once per catch-up; close it when the curation PR merges.')"

  # The daily schedule retries a failed run the next day. If the previous run also
  # failed (two in a row), open or comment on a tracking issue; a success closes it.
  notify:
    needs: refresh
    if: always()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      LABEL: collected-ptr-automation-failure
    steps:
      - name: Raise issue on a second consecutive failure
        if: needs.refresh.result == 'failure'
        run: |
          prev=$(gh run list -R "$REPO" --workflow update-collected-ptr.yml --branch main \
                   --status completed --limit 1 --json conclusion --jq '.[0].conclusion // ""')
          echo "Previous completed run conclusion: ${prev:-none}"
          if [ "$prev" != "failure" ]; then
            echo "First failure — the daily schedule will retry tomorrow. No issue yet."
            exit 0
          fi
          gh label create "$LABEL" -R "$REPO" --color B60205 \
            --description "Collected set-data automation failed" 2>/dev/null || true
          existing=$(gh issue list -R "$REPO" --label "$LABEL" --state open \
                       --json number --jq '.[0].number // ""' 2>/dev/null)
          if [ -n "$existing" ]; then
            gh issue comment -R "$REPO" "$existing" --body "PTR watcher still failing — $RUN_URL"
            exit 0
          fi
          gh issue create -R "$REPO" --label "$LABEL" \
            --title "Collected PTR-preview automation failed two runs in a row" \
            --body "$(printf '%s\n' \
              'The scheduled "Update Collected PTR preview" workflow failed two consecutive runs, so a new PTR patch may not be reflected in Warbandeer_Collected/data/sets_ptr.lua.' \
              '' \
              "Latest failed run: $RUN_URL" \
              '' \
              'Likely causes: wago.tools unreachable or changed; a data-integrity guard tripped; or luacheck rejected the regenerated file.' \
              '' \
              'Investigate via the run logs above, or run `pwsh Warbandeer_Collected/tools/update-sets.ps1 -PtrDelta -Check` locally. See Warbandeer_Collected/tools/UPDATING.md.' \
              '' \
              'This issue auto-closes when a run succeeds.')"

      - name: Close the tracking issue on recovery
        if: needs.refresh.result == 'success'
        run: |
          for n in $(gh issue list -R "$REPO" --label "$LABEL" --state open \
                       --json number --jq '.[].number' 2>/dev/null); do
            gh issue close -R "$REPO" "$n" --comment "PTR watcher recovered — $RUN_URL"
          done
