name: Update Collected set data

# Regenerates the Warbandeer_Collected set data (data/sets.lua + sets_late.lua body
# files, and sets_expand.lua) from live wago.tools TransmogSet data and opens a PR
# when anything changed. Runs daily — and since it only writes
# when the data actually changes, quiet days produce no PR. A daily cadence also
# means a failed run is simply retried the next day; two failures in a row raise a
# tracking issue (auto-closed when a run recovers).
on:
  schedule:
    - cron: "0 7 * * *" # daily 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: update-collected-sets
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pwsh is preinstalled on ubuntu runners; the generator is cross-platform.
      - name: Regenerate body files from wago.tools
        shell: pwsh
        run: ./Warbandeer_Collected/tools/update-sets.ps1

      # Refresh data/sets_expand.lua too (mega-sets / Trading Post). The normal pass
      # above only touches sets.lua, so -Expand is what keeps the generated file current
      # (e.g. new monthly Trading Post ensembles) from tools/expand-groups.txt.
      - name: Refresh sets_expand.lua
        shell: pwsh
        run: ./Warbandeer_Collected/tools/update-sets.ps1 -Expand

      # Validate here: PRs opened with GITHUB_TOKEN don't trigger the normal
      # luacheck workflow, so lint the regenerated file before opening one.
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1.5"
      - uses: leafo/gh-actions-luarocks@v6
      - name: Install luacheck
        run: luarocks install luacheck
      - name: Lint regenerated files
        run: luacheck Warbandeer_Collected/data/sets.lua Warbandeer_Collected/data/sets_late.lua Warbandeer_Collected/data/sets_expand.lua --codes

      - name: Open PR if changed
        uses: peter-evans/create-pull-request@v8
        with:
          branch: bot/collected-set-refresh
          delete-branch: true
          # Only commit the data files — the luacheck step leaves a .luarocks/ dir
          # in the workspace that must not end up in the PR.
          add-paths: |
            Warbandeer_Collected/data/sets.lua
            Warbandeer_Collected/data/sets_late.lua
            Warbandeer_Collected/data/sets_expand.lua
          commit-message: "chore(collected): refresh transmog set data from wago.tools"
          title: "chore(collected): refresh transmog set data from wago.tools"
          body: |
            Automated refresh of the `Warbandeer_Collected` set data
            (`data/sets.lua` + `data/sets_late.lua` + `data/sets_expand.lua`) from live
            [wago.tools](https://wago.tools) `TransmogSet` data.

            Only the inner `sets = { ... }` blocks are regenerated — every group's
            curated metadata, ordering, and comments are preserved. Anything the
            generator can't confidently resolve is left untouched.

            Generated by `Warbandeer_Collected/tools/update-sets.ps1`; see
            `Warbandeer_Collected/tools/UPDATING.md`. Review the diff before merging.
          labels: |
            automated
            collected

  # The daily schedule already retries a failed run the next day. If the previous
  # run also failed (two in a row), open or comment on a tracking issue; a
  # successful run closes it.
  notify:
    needs: refresh
    if: always()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      LABEL: collected-automation-failure
    steps:
      - name: Raise issue on a second consecutive failure
        if: needs.refresh.result == 'failure'
        run: |
          prev=$(gh run list -R "$REPO" --workflow update-collected-sets.yml --branch main \
                   --status completed --limit 1 --json conclusion --jq '.[0].conclusion // ""')
          echo "Previous completed run conclusion: ${prev:-none}"
          if [ "$prev" != "failure" ]; then
            echo "First failure — the daily schedule will retry tomorrow. No issue yet."
            exit 0
          fi
          gh label create "$LABEL" -R "$REPO" --color B60205 \
            --description "Collected set-data automation failed" 2>/dev/null || true
          existing=$(gh issue list -R "$REPO" --label "$LABEL" --state open \
                       --json number --jq '.[0].number // ""' 2>/dev/null)
          if [ -n "$existing" ]; then
            gh issue comment -R "$REPO" "$existing" --body "Still failing — $RUN_URL"
            exit 0
          fi
          gh issue create -R "$REPO" --label "$LABEL" \
            --title "Collected set-data automation failed two runs in a row" \
            --body "$(printf '%s\n' \
              'The scheduled "Update Collected set data" workflow failed two consecutive runs, so Warbandeer_Collected/data/sets.lua is not being refreshed from wago.tools.' \
              '' \
              "Latest failed run: $RUN_URL" \
              '' \
              'Likely causes: wago.tools unreachable or changed; a data-integrity guard tripped (incomplete download / >5% set deletion); or luacheck rejected the generated file.' \
              '' \
              'Investigate via the run logs above, or run `pwsh Warbandeer_Collected/tools/update-sets.ps1 -Check` locally. See Warbandeer_Collected/tools/UPDATING.md.' \
              '' \
              'This issue auto-closes when a run succeeds.')"

      - name: Close the tracking issue on recovery
        if: needs.refresh.result == 'success'
        run: |
          for n in $(gh issue list -R "$REPO" --label "$LABEL" --state open \
                       --json number --jq '.[].number' 2>/dev/null); do
            gh issue close -R "$REPO" "$n" --comment "Automation recovered — $RUN_URL"
          done
