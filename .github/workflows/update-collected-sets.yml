name: Update Collected set data

# Regenerates Warbandeer_Collected/data/sets.lua from live wago.tools TransmogSet
# data and opens a PR when anything changed. Runs weekly + on demand.
on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-collected-sets
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pwsh is preinstalled on ubuntu runners; the generator is cross-platform.
      - name: Regenerate sets.lua from wago.tools
        shell: pwsh
        run: ./Warbandeer_Collected/tools/update-sets.ps1

      # Validate here: PRs opened with GITHUB_TOKEN don't trigger the normal
      # luacheck workflow, so lint the regenerated file before opening one.
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1.5"
      - uses: leafo/gh-actions-luarocks@v4
      - name: Install luacheck
        run: luarocks install luacheck
      - name: Lint regenerated file
        run: luacheck Warbandeer_Collected/data/sets.lua --codes

      - name: Open PR if changed
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/collected-set-refresh
          delete-branch: true
          commit-message: "chore(collected): refresh transmog set data from wago.tools"
          title: "chore(collected): refresh transmog set data from wago.tools"
          body: |
            Automated refresh of `Warbandeer_Collected/data/sets.lua` from live
            [wago.tools](https://wago.tools) `TransmogSet` data.

            Only the inner `sets = { ... }` blocks are regenerated — every group's
            curated metadata, ordering, and comments are preserved. Groups whose
            id/difficulty can't be confidently mapped (Wrath 10/25-man, custom
            labels) are left untouched.

            Generated by `Warbandeer_Collected/tools/update-sets.ps1`; see
            `Warbandeer_Collected/tools/UPDATING.md`. Review the diff before merging.
          labels: |
            automated
            collected
