name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  busted:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # WoW's interpreter is Lua 5.1-based — test on the same version.
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1.5"

      - uses: leafo/gh-actions-luarocks@v4

      - name: Install busted
        run: luarocks install busted

      # Spec roots come from .busted at the repo root.
      - name: Run unit tests
        run: busted --output=utfTerminal

  luacheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1.5"

      - uses: leafo/gh-actions-luarocks@v4

      - name: Install luacheck
        run: luarocks install luacheck

      - name: Run luacheck
        run: luacheck . --codes

  # Validate the hand-authored WoW id literals in the static data files against the live client
  # DB2 (wago.tools). Gated on the linted files so a PR that touches no id-bearing data never
  # depends on wago being up; when it does run, a stale/typo'd id fails the build.
  stale-ids:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: changed
        with:
          filters: |
            data:
              - 'Tooling/lint-stale-ids.ps1'
              - 'Warbandeer_Characters/data/races.lua'
              - 'Warbandeer_Characters/data/professioninfo.lua'
              - 'Warbandeer_Characters/data/classmounts.lua'
              - 'Warbandeer_Collected/data/weapons.lua'
              - 'Warbandeer_Characters/data/glyphinfo.lua'
              - 'Warbandeer_Characters/data/learnedunlocks.lua'
              - 'Warbandeer_Characters/data/collectiblesources.lua'

      # pwsh is preinstalled on the GitHub-hosted ubuntu image. Skipped (job stays green) when no
      # linted data file changed, so the check is safe to mark required in branch protection.
      - name: Lint hand-authored ids
        if: steps.changed.outputs.data == 'true'
        run: pwsh Tooling/lint-stale-ids.ps1
