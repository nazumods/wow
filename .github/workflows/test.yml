name: test

on:
  push:
    branches: [main]
  pull_request:

# Supersede an in-flight run when a PR gets new commits (the synchronize pile-up); main runs are
# left to finish so they keep the build-keyed wago cache warm for PRs to restore.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  busted:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # WoW's interpreter is Lua 5.1-based — test on the same version.
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1.5"

      - uses: leafo/gh-actions-luarocks@v6

      - name: Install busted
        run: luarocks install busted

      # Spec roots come from .busted at the repo root.
      - name: Run unit tests
        run: busted --output=utfTerminal

  luacheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1.5"

      - uses: leafo/gh-actions-luarocks@v6

      - name: Install luacheck
        run: luarocks install luacheck

      - name: Run luacheck
        run: luacheck . --codes

  # WoW loads `<Folder>/<Folder>.toc` and nothing else, so a folder rename that misses its .toc
  # produces a package that silently fails to load for every user who installs it — which is
  # exactly what shipped as ShadowsOfUI-Inventory-v12.0.7-r5 (#742). Both the release script and
  # the publish workflow fell back to *any* .toc in the folder, so the rename sailed through:
  # metadata was read, the zip was built, everything reported success.
  #
  # Caught here rather than only at release time because the rename arrived in a PR, and this is
  # the stage where it costs nothing to fix. release.sh and publish.yml are hardened too, so the
  # same mistake now fails at all three stages.
  toc-name:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Every addon folder has a matching .toc
        run: |
          fail=0
          for dir in */; do
            addon="${dir%/}"
            # A .toc is what makes a folder an addon — same rule release.sh uses. This is what
            # keeps Tooling/, apps/, docs/ and .github/ out without hardcoding a skip list.
            compgen -G "${addon}/*.toc" > /dev/null || continue
            # Retail-only suite, so these are the two names WoW accepts. Add the other flavor
            # suffixes only if a Classic flavor is ever shipped.
            if ! compgen -G "${addon}/${addon}.toc" > /dev/null \
               && ! compgen -G "${addon}/${addon}_Mainline.toc" > /dev/null; then
              echo "::error file=${addon}::${addon}/ has a .toc but none named ${addon}.toc — WoW will not load it"
              ls "${addon}"/*.toc
              fail=1
            fi
          done
          exit $fail

  # Diff each addon's .toc metadata against its CONTEXT.md header (#798). Three batches of this
  # drift have been caught by hand, months late; most of it was mechanically detectable all along.
  # Fully offline, so unlike stale-ids it needs no wago fetch and no daily run — a PR gate is enough.
  doc-drift:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: .toc metadata matches the CONTEXT.md headers
        run: python Tooling/doc_drift.py

  # publish.yml turns each .toc `## Interface:` value into a CurseForge game version, and checks that
  # CurseForge knows it. Reading `16001` (Forever) from the left once gave `16.0.1` (#954), and the upload
  # action drops an unknown version silently -- so the release would have shipped unlabelled. The functions
  # live inline in publish.yml, beside their only caller; this extracts them, and the two steps that call
  # them, from the YAML text and runs those (stub curl, fake .toc files). Fully offline and fast, so no
  # path filter.
  game-versions:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: publish.yml game-version helpers
        run: bash Tooling/tests/game-versions.test.sh

  # Which wago build the lint tooling resolves, and for which product (#954): wow_classic_beta is a shared
  # bucket of several Classic betas whose "latest" is Forever only while Forever is the newest, so Forever
  # runs select a version family. Covers the lint-stale-ids.yml resolve step and its gating (a stub curl
  # over a fixture shaped like wago's /api/builds), the stale-ids job's wiring in this file,
  # lint-stale-ids.ps1's own resolution (a stub Invoke-WebRequest), and what it does when the build has
  # no table for a rule (the same kind of stub: skipped and reported, not aborted). It also covers which PTR build the
  # Collected preview reads (#945): update-sets.ps1 -PtrDelta, armor and weapons, picks the newest patch
  # above live across wago's two PTR products (wowt, wowxptr) and says plainly when none is ahead (the
  # same stub). It also runs update-sets.ps1's two Forever generators, -Forever (sets) and -Weapons -Forever
  # (weapon appearances, #994), against stubbed wago tables. Offline and fast, so no path filter.
  wago-build-resolution:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: lint-stale-ids.yml and test.yml build resolution
        run: bash Tooling/tests/lint-stale-ids-workflow.test.sh

      - name: lint-stale-ids.ps1 build resolution
        shell: pwsh
        run: ./Tooling/tests/lint-stale-ids.build.test.ps1

      - name: lint-stale-ids.ps1 missing tables
        shell: pwsh
        run: ./Tooling/tests/lint-stale-ids.missing-table.test.ps1

      - name: update-sets.ps1 PTR build resolution
        shell: pwsh
        run: ./Tooling/tests/update-sets-ptr.test.ps1

      - name: update-sets.ps1 -Forever generation
        shell: pwsh
        run: ./Tooling/tests/update-sets-forever.test.ps1

      - name: update-sets.ps1 -Weapons -Forever generation
        shell: pwsh
        run: ./Tooling/tests/update-sets-forever-weapons.test.ps1

  # Check each addon's EXTERNAL.md (the CurseForge/Wago page copy, #911) against the two invariants
  # that spec states -- the GitHub URL on the first line and a bug/suggestion section -- and unit-test
  # the checker. Fully offline (no API key, no network), so like doc-drift it is a PR gate with no
  # daily run. Live: every addon carrying an X-Curse-Project-ID is gated; the module docstring records why detection
  # is the ceiling -- no public API writes a CurseForge or Wago description (#912 SPIKE).
  external-drift:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: EXTERNAL.md satisfies the #911 invariants
        run: python Tooling/external_drift.py

      - name: external_drift.py unit tests
        run: python Tooling/test_external_drift.py

  # Validate the hand-authored WoW id literals in the static data files against the live client
  # DB2 (wago.tools). Gated on the linted files so a PR that touches no id-bearing data never
  # depends on wago being up; when it does run, a stale/typo'd id, or a rule whose DB2 table the
  # build lacks, fails the build.
  stale-ids:
    runs-on: ubuntu-latest
    env:
      # The wago product whose latest build is linted: 'wow' = live retail. A Forever run must not use
      # this job's "latest" resolve for wow_classic_beta (a shared bucket of several Classic betas since
      # 2019); pass -VersionPrefix 1.60. or -Build to lint-stale-ids.ps1 instead (Tooling/README.md).
      WAGO_PRODUCT: wow

    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: changed
        with:
          filters: |
            data:
              - 'Tooling/lint-stale-ids.ps1'
              - 'Warbandeer_Characters/data/races.lua'
              - 'Warbandeer_Characters/data/professioninfo.lua'
              - 'Warbandeer_Characters/data/classmounts.lua'
              - 'Warbandeer_Collected/data/weapons.lua'
              - 'Warbandeer_Characters/data/glyphinfo.lua'
              - 'Warbandeer_Characters/data/learnedunlocks.lua'
              - 'Warbandeer_Characters/data/collectiblesources.lua'

      # pwsh is preinstalled on the GitHub-hosted ubuntu image. Skipped (job stays green) when no
      # linted data file changed, so the check is safe to mark required in branch protection.
      # Resolve the live build once (a ~1KB call) — it keys the CSV cache and pins the lint, so a
      # run pulls the heavy tables only when Blizzard shipped a new build since the cache warmed.
      - name: Resolve wago build
        if: success() && steps.changed.outputs.data == 'true'
        id: build
        run: echo "version=$(curl -sf -A 'Warbandeer-suite-ci (github.com/nazumods/wow)' "https://wago.tools/api/builds/${WAGO_PRODUCT}/latest" | jq -r .version)" >> "$GITHUB_OUTPUT"
      - name: Restore wago CSV cache for this build
        if: success() && steps.changed.outputs.data == 'true'
        uses: actions/cache@v6
        with:
          path: .wago-cache
          key: wago-csv-${{ env.WAGO_PRODUCT }}-${{ steps.build.outputs.version }}
      - name: Lint hand-authored ids
        if: success() && steps.changed.outputs.data == 'true'
        run: pwsh Tooling/lint-stale-ids.ps1 -Product "$WAGO_PRODUCT" -Build "${{ steps.build.outputs.version }}" -CacheDir .wago-cache
