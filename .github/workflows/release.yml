name: release

on:
  schedule:
    # 10:00 America/New_York (14:00 UTC EST / shifts to 09:00 ET during DST).
    - cron: '0 14 * * *'
  workflow_dispatch:

# Needed to create tags, releases, and push the version-bump commit.
permissions:
  contents: write

# Only one release run at a time. If a second push lands while a release is
# in progress, queue it — don't cancel. When the queued run starts it will
# find no unreleased commits (all tags were already created) and exit early.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required to find previous release tags.
          fetch-depth: 0
          # Use RELEASE_TOKEN so git pushes are authenticated as an admin,
          # allowing the version-bump commit to bypass the PR ruleset.
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release changed addons
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          chmod +x .github/scripts/release.sh
          .github/scripts/release.sh
