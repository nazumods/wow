name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed to create tags, releases, and push the version-bump commit.
permissions:
  contents: write

# Only one release run at a time. If a second push lands while a release is
# in progress, queue it — don't cancel. When the queued run starts it will
# find no unreleased commits (all tags were already created) and exit early.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Skip the version-bump commit that this workflow itself pushes.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required to find previous release tags.
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release changed addons
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          chmod +x .github/scripts/release.sh
          .github/scripts/release.sh
